name: first-build
on:
  workflow_dispatch:
    inputs:
      os: {description: "runner label", required: true, default: ubuntu-latest}
      rev: {description: "chromium src revision (empty = main HEAD)", required: false, default: ""}
run-name: first-build ${{ inputs.os }} ${{ inputs.rev }}
jobs:
  s1:
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "1"
      rev: ${{ inputs.rev }}
  s2:
    needs: s1
    if: needs.s1.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "2"
      rev: ${{ inputs.rev }}
  s3:
    needs: s2
    if: needs.s2.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "3"
      rev: ${{ inputs.rev }}
  s4:
    needs: s3
    if: needs.s3.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "4"
      rev: ${{ inputs.rev }}
  s5:
    needs: s4
    if: needs.s4.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "5"
      rev: ${{ inputs.rev }}
  s6:
    needs: s5
    if: needs.s5.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "6"
      rev: ${{ inputs.rev }}
  s7:
    needs: s6
    if: needs.s6.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "7"
      rev: ${{ inputs.rev }}
  s8:
    needs: s7
    if: needs.s7.outputs.status == 'running'
    uses: ./.github/workflows/stage.yml
    with:
      os: ${{ inputs.os }}
      stage: "8"
      rev: ${{ inputs.rev }}
