name: dbg
on:
  workflow_dispatch:
    inputs:
      os: {required: true, default: macos-latest}
      state_run: {required: true}
run-name: dbg ${{ inputs.os }} ${{ inputs.state_run }}
jobs:
  dbg:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: state-${{ inputs.os }}
          path: ~/cbs/pack
          run-id: ${{ inputs.state_run }}
          github-token: ${{ github.token }}
      - name: Unpack
        run: . ci/lib.sh; echo "TAR=$TAR"; $TAR --version | head -1; unpack $W/pack; df -h $W
      - name: Why does mac_sysroot rerun in a new VM, and does it rerun twice in the same VM
        run: |
          . ci/lib.sh; cd $SRC; set +e
          SISO=third_party/siso/cipd/siso
          H=out/Default/sdk/xcode_links/MacOSX*.sdk/usr/include/arpa/nameser.h
          stat -f "disk mtime %Fm %N" $H
          for i in 1 2; do
            $SISO ninja --offline -C out/Default obj/build/modules/system/module.pcm > $LOGS/pcm$i.log 2>&1
            echo "RUN$i $(grep -E '^noexec:|Build' $LOGS/pcm$i.log | tr '\n' ' ')"
            echo "RUN$i explain: $(cut -c1-260 out/Default/siso_explain | head -3 | tr '\n' '|')"
            echo "RUN$i siso.INFO lines on xcode_links: $(grep -c xcode_links out/Default/siso.INFO)"
            grep xcode_links out/Default/siso.INFO | sed -E 's/^[^]]*\] //' | sed -E 's/[A-Za-z0-9_+.-]+\.h/X.h/g; s/[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9:.]+ [+-][0-9]+ [A-Z]+/TIME/g' | cut -c1-110 | sort | uniq -c | sort -rn | head -6
            grep -m2 'arpa/nameser.h' out/Default/siso.INFO | cut -c1-420
            grep -E 'eq:[0-9]+ new:' out/Default/siso.INFO | head -2 | cut -c1-300
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-dbg-${{ inputs.os }}
          path: ~/cbs/logs/
