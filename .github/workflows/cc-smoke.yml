name: cc-smoke
on:
  workflow_dispatch:
    inputs:
      os: {required: true, default: ubuntu-latest}
      rev: {required: false, default: ""}
      target: {required: false, default: base}
jobs:
  smoke:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Install caches
        run: |
          if [ "$(uname)" = Linux ]; then sudo apt-get update -q; sudo apt-get install -y -q ccache
            url=$(gh api repos/mozilla/sccache/releases/latest --jq '.assets[]|select(.name|test("x86_64-unknown-linux-musl.tar.gz$"))|.browser_download_url')
          else brew install ccache
            url=$(gh api repos/mozilla/sccache/releases/latest --jq '.assets[]|select(.name|test("aarch64-apple-darwin.tar.gz$"))|.browser_download_url')
          fi
          mkdir -p ~/sc && curl -sL "$url" | tar -xz -C ~/sc --strip-components=1 && sudo cp ~/sc/sccache /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout chromium
        run: ci/setup.sh "${{ inputs.rev }}"
      - name: Smoke
        run: TARGET="${{ inputs.target }}" ci/cc-smoke.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-cc-smoke-${{ inputs.os }}
          path: ~/cbs/logs/
