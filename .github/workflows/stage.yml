name: stage
on:
  workflow_call:
    inputs:
      os: {required: true, type: string}
      stage: {required: true, type: string}
      rev: {required: false, type: string, default: ""}
    outputs:
      status:
        value: ${{ jobs.stage.outputs.status }}
jobs:
  stage:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Free disk
        run: |
          df -h
          if [ "$(uname)" = Linux ]; then sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          else sudo rm -rf "$ANDROID_HOME"; sudo mdutil -a -i off || true; fi
          df -h
      - name: Download state
        if: inputs.stage != '1'
        uses: actions/download-artifact@v8
        with:
          name: state-${{ inputs.os }}
          path: ~/cbs/pack
      - name: Unpack state
        if: inputs.stage != '1'
        run: |
          . ci/lib.sh; ts unpack_begin; ls -la $W/pack; unpack $W/pack; ts unpack_end; df -h $W
      - name: Build
        id: build
        run: ci/stage.sh "${{ inputs.stage }}" "${{ inputs.rev }}"
      - name: Upload state
        uses: actions/upload-artifact@v7
        with:
          name: state-${{ inputs.os }}
          path: ~/cbs/pack/
          compression-level: 0
          overwrite: true
          retention-days: 5
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ inputs.os }}-stage${{ inputs.stage }}
          path: ~/cbs/logs/
          retention-days: 30
